# Defaults assume Postgres on localhost.
#   Homebrew / Postgres.app: nothing to set, your OS user is used.
#   docker compose:          export DB_USER=postgres
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV["DB_USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: practice_mastery_development

test:
  <<: *default
  database: practice_mastery_test

production:
  <<: *default
  database: practice_mastery_production
